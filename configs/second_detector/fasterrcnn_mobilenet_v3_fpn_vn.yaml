protocol_id: vnwoodknot_fasterrcnn_robustness_v1
dataset: vnwoodknot
variants:
- baseline
- a1_crop
- a2_colorjitter
seeds:
- 42
- 43
- 44
model:
  architecture: fasterrcnn_mobilenet_v3_large_fpn
  initialization: torchvision COCO DEFAULT weights
  foreground_classes: 2
  trainable_backbone_layers: 3
  image_size: 1024
training:
  epochs: 50
  batch_size: 4
  optimizer: SGD
  learning_rate: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: MultiStepLR
  milestones:
  - 35
  - 45
  gamma: 0.1
  amp: true
  deterministic: true
  online_augmentation: none
selection:
  split: val
  metric: mAP50_95
evaluation:
  common_non_augmented_val_test: true
  confidence: 0.001
  nms_iou: 0.7
  max_detections: 300
  rpn_score_threshold: 0.05
  matching: Ultralytics 8.4.60 BaseValidator greedy matching
  ap: Ultralytics 8.4.60 ap_per_class
